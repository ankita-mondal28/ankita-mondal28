name: Sync Credly Badges

on:
  schedule:
    - cron: "0 0 * * 0" # Runs automatically every Sunday
  workflow_dispatch: # Manual trigger

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Credly Badges
        run: |
          python -c '
          import requests, re

          USERNAME = "ankita-mondal28" 
          
          url = f"https://www.credly.com/users/{USERNAME}/badges.json"
          response = requests.get(url)
          
          if response.status_code != 200:
              print(f"Failed to fetch badges: {response.status_code}")
              exit(1)

          badges_data = response.json().get("data", [])
          if not badges_data:
              print("No badges found or profile is private.")
              exit(0)

          badge_html = "\n<div align=\"center\">\n"
          for item in badges_data:
              badge = item.get("badge_template", {})
              
              # Pull direct image URL or template image fallback
              image_url = badge.get("image_url") or (badge.get("image", {}) if isinstance(badge.get("image"), dict) else {}).get("url")
              
              # Ensure standard HTTPS link format
              if image_url and not image_url.startswith("http"):
                  image_url = f"https:{image_url}"

              badge_name = badge.get("name", "Badge")
              badge_id = item.get("id")
              link = f"https://www.credly.com/badges/{badge_id}/public_url"
              
              if image_url:
                  badge_html += f"  <a href=\"{link}\" target=\"_blank\"><img src=\"{image_url}\" width=\"100\" height=\"100\" alt=\"{badge_name}\" title=\"{badge_name}\" style=\"margin: 5px; object-fit: contain;\" /></a>\n"
          
          badge_html += "</div>\n"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- CREDLY_BADGES:START -->.*?<!-- CREDLY_BADGES:END -->"
          replacement = f"<!-- CREDLY_BADGES:START -->\n{badge_html}<!-- CREDLY_BADGES:END -->"
          
          updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated_readme)
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync Credly badges"
            git push
          fi
